[project]
name = "codecopilot"
version = "0.1.0"
description = "A RAG-based CLI tool for asking questions about a codebase"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "google-genai",
    "sentence-transformers",
    "psycopg2-binary",
    "pgvector",
    "tree-sitter>=0.25,<0.26",  # 0.26.0 segfaults while walking some larger files
    "tree-sitter-python",
    "tenacity",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
]

[tool.setuptools]
py-modules = [
    "cli",
    "ask",
    "search_query",
    "ranking",
    "prompt",
    "prompt_registry",
    "call_graph",
    "read_repo",
    "incremental_index",
    "seed_data",
    "embedder",
    "db_connection",
    "config",
    "tracing",
    "latency_report",
    "api",
    "evaluation_script",
    "evaluation_loop",
    "gold_set",
]

[project.scripts]
codecopilot = "cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
